[package]
name = "config_share"
version = "0.1.0"
edition = "2024"
default-run = "config_share"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["cargo"] }
console = { version = "0.16.1", features = ["windows-console-colors"] }
dialoguer = { version = "0.12.0", features = ["history"] }
lazy_static = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
twox-hash = "2.1.2"
url = { version = "2.5.7", features = ["serde"] }
util = { path = "../util" }
