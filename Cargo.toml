[package]
name = "config_share"
version = "0.3.1"
edition = "2024"
default-run = "config_share"

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
api-types = { git = "https://github.com/Icefire113/sync_server.git", version = "0.2.0", features = [
    "client",
] }
argon2 = { version = "0.6.0" }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.7", features = ["cargo"] }
console = { version = "0.16.6", features = ["windows-console-colors"] }
dialoguer = { version = "0.12.0", features = ["history"] }
dunce = "1.0.5"
env_logger = "0.11.11"
getrandom = { version = "0.4.3", features = ["std"] }
gethostname = "1.1.0"
keyring = "4.2.0"
lazy_static = "1.5.1"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154" }
similar = "3.2.0"
tabled = "0.22.0"
thiserror = "2.0.21"
twox-hash = "2.1.5"
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4", "fast-rng"] }
zeroize = "1.9.1"
